<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneClickDownload (v9)</title>

    
    
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>'>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px;
        }
        .downloader-card {
            width: 90%;
            max-width: 900px; 
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.07);
            border: 1px solid #e7eaf3;
        }
        h2 { 
            text-align: center; color: #212529;
            margin-top: 0; margin-bottom: 2rem; font-weight: 600;
            display: flex; justify-content: center;
            align-items: center; gap: 0.5rem;
        }
        .input-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .form-group { margin-bottom: 0; }
        input[type="text"] {
            width: 100%; padding: 0.8rem; border: 1px solid #ced4da;
            border-radius: 8px; box-sizing: border-box; 
            background-color: #f8f9fa;
            font-family: 'Noto Sans Thai', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            outline: none; border-color: #80bdff;
            background-color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        button {
            width: 100%; padding: 0.9rem; border: none; 
            border-radius: 8px;
            background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%);
            color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.3);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(0, 123, 255, 0.2);
        }
        
        #statusArea {
            margin-top: 2rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .progress-item {
            margin-bottom: 1rem;
        }
        .progress-item-info {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 5px;
            height: 20px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%; 
            height: 100%;
            background-color: #28a745; 
            transition: width 0.3s ease;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            line-height: 20px;
            font-weight: bold;
        }
        .progress-bar.status-downloading { background-color: #007bff; }
        .progress-bar.status-finished { background-color: #28a745; }
        .progress-bar.status-error { background-color: #dc3545; }
        .empty-hint { color: #dc3545; text-align: center; }
        .platforms { text-align: center; color: #6c757d; font-size: 0.9rem; margin: -10px 0 20px; }
    </style>
</head>
<body>

    <div class="downloader-card">
        
        <h2>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            OneClickDownload (v9)
        </h2>
        <p class="platforms">รองรับ: Facebook · TikTok · YouTube<br><small>(YouTube ใช้ได้เฉพาะตอนรันแอปบนเครื่องตัวเอง)</small></p>
        
        <div class="input-grid-container">
            <div class="form-group"><input type="text" id="urlInput1" placeholder="วางลิงก์ที่ 1"></div>
            <div class="form-group"><input type="text" id="urlInput2" placeholder="วางลิงก์ที่ 2"></div>
            <div class="form-group"><input type="text" id="urlInput3" placeholder="วางลิงก์ที่ 3"></div>
            <div class="form-group"><input type="text" id="urlInput4" placeholder="วางลิงก์ที่ 4"></div>
            <div class="form-group"><input type="text" id="urlInput5" placeholder="วางลิงก์ที่ 5"></div>
            <div class="form-group"><input type="text" id="urlInput6" placeholder="วางลิงก์ที่ 6"></div>
            <div class="form-group"><input type="text" id="urlInput7" placeholder="วางลิงก์ที่ 7"></div>
            <div class="form-group"><input type="text" id="urlInput8" placeholder="วางลิงก์ที่ 8"></div>
            <div class="form-group"><input type="text" id="urlInput9" placeholder="วางลิงก์ที่ 9"></div>
            <div class="form-group"><input type="text" id="urlInput10" placeholder="วางลิงก์ที่ 10"></div>
        </div>
        
        <button id="downloadAllButton">ดาวน์โหลดทั้งหมด</button>
        
        <div id="statusArea">
            </div>
    </div>

    <script>
        // --- JavaScript (v8 - เหมือนเดิม) ---
        
        const downloadAllButton = document.getElementById("downloadAllButton");
        const statusArea = document.getElementById("statusArea");
        // รันในเครื่อง (localhost) ให้เรียก API ของเซิร์ฟเวอร์ตัวเอง, ไม่งั้นใช้เซิร์ฟเวอร์บน Render
        const apiUrl = ["localhost", "127.0.0.1"].includes(location.hostname)
            ? ""
            : "https://mydownloader-8iq3.onrender.com";

        // แพลตฟอร์มที่รองรับ (ต้องตรงกับ SUPPORTED_PLATFORMS ใน app.py)
        const SUPPORTED_PLATFORMS = {
            "Facebook": ["facebook.com", "fb.watch", "fb.com"],
            "YouTube": ["youtube.com", "youtu.be"],
            "TikTok": ["tiktok.com"],
        };

        function detectPlatform(url) {
            let host;
            try { host = new URL(url).hostname.toLowerCase(); } catch { return null; }
            for (const [name, domains] of Object.entries(SUPPORTED_PLATFORMS)) {
                if (domains.some(d => host === d || host.endsWith("." + d))) return name;
            }
            return null;
        }

        // นับจำนวนงานทั้งหมด ใช้ทำ id ไม่ให้ซ้ำ (กดปุ่มซ้ำ / ใช้ช่องเดิมซ้ำ ระหว่างที่ยังโหลดอยู่)
        let jobCounter = 0;

        downloadAllButton.addEventListener("click", function() {
            const urls = [];
            for (let i = 1; i <= 10; i++) {
                const urlInput = document.getElementById(`urlInput${i}`);
                const url = urlInput.value.trim();
                if (url) {
                    urls.push([url, i]);
                    urlInput.value = "";
                }
            }

            if (urls.length === 0) {
                alertEmpty();
                return;
            }

            // ไม่ล้างรายการเดิม เพื่อให้ไฟล์ที่กำลังโหลดอยู่ยังเห็นสถานะต่อ
            if (!statusArea.querySelector("h4")) {
                statusArea.insertAdjacentHTML('afterbegin', "<h4>สถานะการดาวน์โหลด:</h4>");
            }
            statusArea.querySelector(".empty-hint")?.remove();
            urls.forEach(([url, i]) => startFetchDownload(url, i));
        });

        function alertEmpty() {
            if (!statusArea.querySelector(".empty-hint")) {
                statusArea.insertAdjacentHTML('beforeend', '<p class="empty-hint">กรุณาวางลิงก์อย่างน้อย 1 ช่อง</p>');
            }
        }

        async function startFetchDownload(url, slotIndex) {
            // 1. สร้าง HTML สำหรับ Progress Bar
            const jobId = ++jobCounter;
            const barId = `progress-bar-${jobId}`;
            const textId = `progress-text-${jobId}`;

            const itemHtml = `
                <div class="progress-item">
                    <div class="progress-item-info" id="${textId}">(ช่อง ${slotIndex}) กำลังเชื่อมต่อ...</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar status-downloading" id="${barId}">0%</div>
                    </div>
                </div>
            `;
            statusArea.insertAdjacentHTML('beforeend', itemHtml);
            
            const progressBar = document.getElementById(barId);
            const progressText = document.getElementById(textId);

            const platform = detectPlatform(url);
            if (!platform) {
                progressBar.className = "progress-bar status-error";
                progressText.textContent = `[ล้มเหลว] (ช่อง ${slotIndex}) - รองรับเฉพาะลิงก์ Facebook, YouTube และ TikTok`;
                return;
            }

            if (platform === "YouTube") {
                progressText.textContent = `(ช่อง ${slotIndex}) เซิร์ฟเวอร์กำลังเตรียมไฟล์ YouTube (อาจใช้เวลาสักครู่)...`;
            }

            try {
                // 2. สร้าง URL สำหรับเรียก API
                const downloadUrl = `${apiUrl}/download_video?url=${encodeURIComponent(url)}`;
                
                // 3. สั่ง Fetch เพื่อเริ่มดาวน์โหลด
                const response = await fetch(downloadUrl);

                if (!response.ok) {
                    let message = `เซิร์ฟเวอร์ล้มเหลว (Error ${response.status})`;
                    try { message = (await response.json()).error || message; } catch {}
                    throw new Error(message);
                }

                // 4. ดึงขนาดไฟล์ทั้งหมด (ถ้ามี)
                const contentLength = response.headers.get('content-length');
                const totalSize = parseInt(contentLength, 10);
                
                // 5. ดึงชื่อไฟล์จาก Header
                let filename = "download.mp4";
                const disposition = response.headers.get('content-disposition');
                if (disposition) {
                    const utf8FilenameMatch = /filename\*=UTF-8''([\w%\-\.]+)/.exec(disposition);
                    if (utf8FilenameMatch) {
                        filename = decodeURIComponent(utf8FilenameMatch[1]);
                    } else {
                        const asciiFilenameMatch = /filename="([^"]+)"/.exec(disposition);
                        if (asciiFilenameMatch) {
                            filename = asciiFilenameMatch[1];
                        }
                    }
                }
                
                progressText.textContent = `[กำลังโหลด] (${platform}) ${filename}`;

                // 6. อ่านไฟล์ที่สตรีมมา (เพื่อคำนวณ %)
                const reader = response.body.getReader();
                let loaded = 0;
                let chunks = []; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value); 
                    loaded += value.length;

                    if (totalSize > 0) {
                        const percent = Math.floor((loaded / totalSize) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressBar.textContent = `${percent}%`;
                    }
                }

                // 7. ดาวน์โหลดเสร็จ 100%
                progressText.textContent = `[เสร็จสิ้น] ${filename} - กำลังบันทึก...`;
                progressBar.style.width = `100%`;
                progressBar.textContent = `100%`;
                progressBar.className = "progress-bar status-finished";

                // 8. รวมไฟล์ใน RAM (Blob)
                const blob = new Blob(chunks);
                
                // 9. สร้าง URL ชั่วคราว (ในเครื่อง)
                const localUrl = window.URL.createObjectURL(blob);
                
                // 10. สั่ง "Save As..."
                const a = document.createElement('a');
                a.href = localUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(localUrl); 

            } catch (error) {
                console.error(`(ช่อง ${slotIndex}) Error:`, error);
                progressBar.className = "progress-bar status-error";
                progressText.textContent = `[ล้มเหลว] (ช่อง ${slotIndex}) - ${error.message}`;
            }
        }
    </script>

</body>
</html>
